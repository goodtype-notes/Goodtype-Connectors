[package]
name = "goodtype-connectors"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
description = "Goodtype addon: connectors that stay attached to parts"
publish = false
default-run = "goodtype-connectors"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The capability-free Extism byte ABI for the sideload-only W1 experiment.
extism-pdk = { version = "=1.4.1", default-features = false }
